services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gpss
      POSTGRES_USER: gpss
      POSTGRES_PASSWORD: gpss
    ports:
      - "127.0.0.1:${GPSS_DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpss -d gpss"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
      target: final
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=gpss;Username=gpss;Password=gpss
      Cors__AllowedOrigins__0: http://localhost:8080
      Cors__AllowedOrigins__1: http://127.0.0.1:8080
      Cors__AllowedOrigins__2: http://localhost:5173
      Cors__AllowedOrigins__3: http://127.0.0.1:5173
    ports:
      - "127.0.0.1:3001:8080"

  web:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12

  # Backend integration tests against a throwaway database on the same PostgreSQL server:
  #   docker compose --profile test run --rm api-tests
  api-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      GPSS_TEST_DB: Host=db;Port=5432;Database=postgres;Username=gpss;Password=gpss

  # End-to-end browser tests against the running stack:
  #   docker compose --profile test run --rm e2e
  e2e:
    profiles: ["test"]
    build:
      context: .
      dockerfile: e2e/Dockerfile
    depends_on:
      web:
        condition: service_healthy
    environment:
      E2E_BASE_URL: http://web
    ipc: host

volumes:
  postgres_data:
