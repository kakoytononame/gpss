# Builds the API and web images, publishes them to GitHub Container Registry and assembles the run package
# GPSS-Studio-<tag>.zip (START/STOP buttons + docker-compose.yml with these images, no source code).
#   push to main        -> images :latest and :main
#   push to any branch  -> images :<branch>, package as a workflow artifact
#   tag v1.2.3          -> images :1.2.3 and :latest, package attached to a GitHub release
name: Docker images

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: kakoytononame

jobs:
  images:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
          else
            tag="$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: final
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/gpss-api:${{ steps.tag.outputs.tag }}
            ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && format('{0}/{1}/gpss-api:latest', env.REGISTRY, env.OWNER) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=GPSS Studio API
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/gpss-web:${{ steps.tag.outputs.tag }}
            ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && format('{0}/{1}/gpss-web:latest', env.REGISTRY, env.OWNER) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=GPSS Studio Web
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Starts the published images the way the run package does and checks the API, the database and the web page.
  smoke-test:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the run package
        working-directory: docker/release
        env:
          GPSS_IMAGE_TAG: ${{ needs.images.outputs.tag }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker compose up -d --wait --wait-timeout 180
      - name: Check the services
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3001/api/health
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl --fail --silent --show-error http://127.0.0.1:8080/api/alina-gpss/studio/queueing/presets | grep -q '"mm1"'
      - name: Container logs
        if: failure()
        working-directory: docker/release
        run: docker compose logs --tail 100

  package:
    needs: [images, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the run package
        env:
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          dir="GPSS-Studio-$TAG"
          mkdir -p "$dir/scripts/windows"
          sed "s/\${GPSS_IMAGE_TAG:-latest}/\${GPSS_IMAGE_TAG:-$TAG}/" docker/release/docker-compose.yml > "$dir/docker-compose.yml"
          cp START_GPSS_STUDIO.cmd STOP_GPSS_STUDIO.cmd "$dir/"
          cp scripts/windows/Start-GpssStudio.ps1 "$dir/scripts/windows/"
          cp docker/release/README.txt "$dir/"
          zip -r "$dir.zip" "$dir"
          echo "PACKAGE=$dir" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: ${{ env.PACKAGE }}.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "GPSS Studio $GITHUB_REF_NAME" --notes "Скачайте GPSS-Studio-*.zip, распакуйте и запустите START_GPSS_STUDIO.cmd (нужен Docker Desktop)."
          gh release upload "$GITHUB_REF_NAME" "$PACKAGE.zip" --clobber
